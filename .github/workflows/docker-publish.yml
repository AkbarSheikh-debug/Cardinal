name: Publish images

# Publishes the three Docker Hub images (D-093). Local equivalent: `make docker-push`, which
# runs scripts/publish_docker.sh and does exactly what the `build` job below does -- one script
# and one workflow, deliberately doing the same thing, so a release never depends on which
# machine cut it.
#
# Needs two repository secrets:
#   DOCKERHUB_USERNAME   the namespace images are pushed under (akbardebug)
#   DOCKERHUB_TOKEN      an access token from hub.docker.com/settings/security -- NOT a
#                        password, and scoped Read/Write, not Admin
#
# Runs on a `v*` tag push. Version comes from the tag (`v0.2.0` -> `0.2.0`), so the images and
# the git history cannot disagree about what a release contains.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # No fail-fast: if the 300MB all-in-one image fails, still find out whether the other two
      # are fine rather than cancelling them and re-running the whole matrix to learn it.
      fail-fast: false
      matrix:
        include:
          - image: cardinal
            context: .
            dockerfile: Dockerfile.allinone
          - image: cardinal-api
            context: .
            dockerfile: Dockerfile
          - image: cardinal-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation on an amd64 runner. It is slow (the frontend's `npm ci`
      # especially), and it is the reason anyone on Apple silicon can `docker run` this at all
      # instead of watching Rosetta refuse a linux/amd64 manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The Hub page people land on is the repository description, and it is the only documentation
  # a `docker run` user ever sees. Kept in the repo (docs/dockerhub/*.md) and pushed from it,
  # rather than pasted into a web form where it would go stale on the first README edit.
  readme:
    name: sync Docker Hub descriptions
    runs-on: ubuntu-latest
    needs: build
    if: success()
    strategy:
      matrix:
        include:
          - image: cardinal
            file: docs/dockerhub/cardinal.md
          - image: cardinal-api
            file: docs/dockerhub/cardinal-api.md
          - image: cardinal-web
            file: docs/dockerhub/cardinal-web.md
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          readme-filepath: ${{ matrix.file }}
