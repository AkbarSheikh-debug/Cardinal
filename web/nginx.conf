# Serves the built A2UI/MCP-App-host frontend and proxies everything backend-shaped to `api`
# by its compose hostname (Docker's internal DNS resolves `api` -- no hardcoded IP, matches
# `vite.config.ts`'s dev-time proxy target list one for one so local dev and the container
# behave the same way, PHASE-11 SS3's own point about `booking` needing a real hostname
# applied here too).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE: `GET /sessions/{id}/events` must not be buffered or it stops being a stream.
    location ~ ^/sessions/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /sessions/ {
        proxy_pass http://api:8000;
        # A live agent turn is tens of seconds (measured ~72s for one INTERVIEW turn on
        # opus-5/effort=high). nginx's 60s default read timeout cut those off as a 504 that
        # surfaced in the UI as a failed message while the backend went on to answer fine.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /adapters {
        proxy_pass http://api:8000;
    }

    # D-056's model picker (GET /models). Missing this sent the request through the SPA
    # fallback below instead -- 200 OK with index.html's body, silently parsed as zero models
    # by fetchModels()'s own try/catch, so the picker never rendered and nothing said why.
    #
    # Exact match (`=`), not a prefix: `location /models { ... }` (this block's first draft)
    # also intercepted `/models/powertrain/*.glb` -- P6's static 3D-asset path, unrelated to
    # this route and older than it -- and proxied those to the API too, which 404'd them.
    # `<model-viewer>` had nothing to load and rendered as an empty box with no console error,
    # discovered only by actually looking at a screenshot of beat 5 (D-057).
    location = /models {
        proxy_pass http://api:8000;
    }

    location /mcp-apps/ {
        proxy_pass http://api:8000;
    }

    location /demo/ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
