# Serves the built A2UI/MCP-App-host frontend and proxies everything backend-shaped to `api`
# by its compose hostname (Docker's internal DNS resolves `api` -- no hardcoded IP, matches
# `vite.config.ts`'s dev-time proxy target list one for one so local dev and the container
# behave the same way, PHASE-11 SS3's own point about `booking` needing a real hostname
# applied here too).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE: `GET /sessions/{id}/events` must not be buffered or it stops being a stream.
    location ~ ^/sessions/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /sessions/ {
        proxy_pass http://api:8000;
        # A live agent turn is tens of seconds (measured ~72s for one INTERVIEW turn on
        # opus-5/effort=high). nginx's 60s default read timeout cut those off as a 504 that
        # surfaced in the UI as a failed message while the backend went on to answer fine.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /adapters {
        proxy_pass http://api:8000;
    }

    # D-056's model picker (GET /models). Missing this sent the request through the SPA
    # fallback below instead -- 200 OK with index.html's body, silently parsed as zero models
    # by fetchModels()'s own try/catch, so the picker never rendered and nothing said why.
    #
    # Exact match (`=`), not a prefix: `location /models { ... }` (this block's first draft)
    # also intercepted `/models/powertrain/*.glb` -- P6's static 3D-asset path, unrelated to
    # this route and older than it -- and proxied those to the API too, which 404'd them.
    # `<model-viewer>` had nothing to load and rendered as an empty box with no console error,
    # discovered only by actually looking at a screenshot of beat 5 (D-057).
    location = /models {
        proxy_pass http://api:8000;
    }

    location /mcp-apps/ {
        proxy_pass http://api:8000;
    }

    location /demo/ {
        proxy_pass http://api:8000;
    }

    # PLAN-02 P12. Without these two the SPA fallback below answers `/auth/me` with
    # index.html and a 200, which `fetchSession()` then fails to parse -- the exact shape of
    # D-057's `/models` bug, which cost a debugging session the first time.
    location /auth/ {
        proxy_pass http://api:8000;
    }

    # SSE: `GET /seller/events` (PLAN-02 §0.4) must not be buffered or the console's live
    # lead feed appears dead. Same treatment `/sessions/{id}/events` gets above, and it has
    # to come *before* the `/seller/` block below or nginx's longest-prefix rule would hand
    # this path to the buffered one.
    location = /seller/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # The bare page routes, and they have to be *exact* matches (`=`), which outrank every
    # prefix location in nginx regardless of order.
    #
    # Without these two, `/cart` and `/seller` 404. The prefix blocks below are defined with a
    # trailing slash and contain `proxy_pass`, and nginx answers a request that exactly matches
    # such a location minus its slash with an implicit 301 to the slashed form -- `/cart` ->
    # `/cart/` -> the cart API, which has no such route. The SPA fallback at the bottom never
    # gets a chance to run. Clicking through the app hid it completely: React Router handles
    # those transitions client-side and never asks nginx, so only a hard reload, a bookmark or
    # a pasted link ever hit it.
    #
    # Fourth member of the D-057 family (`/models`, then `/auth`, then `/voice`), and the
    # second consequence of D-076's page-vs-API prefix collision. `/auth`, `/voice` and
    # `/sessions` deliberately get no equivalent: they are API-only, there is no client-side
    # route behind them (web/src/routes.tsx defines exactly `/`, `/login`, `/chat`, `/cart`,
    # `/seller`), so redirecting them costs nothing.
    location = /cart {
        try_files /index.html =404;
    }

    location = /seller {
        try_files /index.html =404;
    }

    # PLAN-02 P12/P15. Prefix *with* the trailing slash and nothing matching bare `/seller`:
    # `/seller` is the client-side route and `/seller/...` is the API, and nginx cannot tell
    # a page navigation from a fetch() by path alone. Every seller API route lives one level
    # down (`/seller/profile`, `/seller/leads`, `/seller/events`, `/seller/dealers`), which
    # makes the split a property of the path shape -- D-076, the same collision `/cart` hit.
    location /seller/ {
        proxy_pass http://api:8000;
    }

    # PLAN-02 P14. Prefix *with* the trailing slash, and nothing matching bare `/cart`:
    # `/cart` is a client-side route AND `/cart/...` is the cart API, and nginx cannot tell a
    # page navigation from a fetch() by path alone. `src/api/cart.py` therefore puts every
    # route one level down (`/cart/items`, `/cart/checkout`, `/cart/count`), which makes the
    # split a property of the path shape: this block takes the API, the SPA fallback below
    # takes the page. D-076, and the third instance of D-057's family of bug.
    location /cart/ {
        proxy_pass http://api:8000;
    }

    # PLAN-02 P16. Its absence is what made every voice call return index.html with a 200:
    # `fetch` got HTML, `.json()` threw, and the UI reported "transcription failed" while the
    # provider key was never reached. Third occurrence of the same SPA-fallback trap (D-057,
    # then /auth, then this) -- gate 16.13 now derives the required prefixes from FastAPI's
    # own route table and fails if any lacks a block here, so there cannot be a fourth.
    location /voice/ {
        proxy_pass http://api:8000;
        # Synthesising a paragraph takes longer than a JSON round trip.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
