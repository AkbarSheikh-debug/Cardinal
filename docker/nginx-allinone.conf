# nginx's *main* config for the all-in-one image (`Dockerfile.allinone`) only. The four-service
# compose stack does not use this file -- there, `nginxinc/nginx-unprivileged` brings its own
# main config and `web/nginx.conf` is dropped in as the server block.
#
# Here nginx is one of three processes inside a single container, started by
# `docker/entrypoint.sh` as the unprivileged `cardinal` user, so every path nginx writes to has
# to be one that user owns. Debian's packaged main config assumes root: /run/nginx.pid,
# /var/lib/nginx/*, /var/log/nginx/*. All of it is redirected to /tmp (the entrypoint creates
# the directories) or to the container's stdout/stderr, which is where a container's logs
# belong anyway -- `docker logs` should show nginx without anyone exec'ing in to find a file.
worker_processes auto;
daemon off;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The server block itself is `web/nginx.conf` with its `api:8000` upstream rewritten to
    # 127.0.0.1:8000 at build time (see Dockerfile.allinone) -- one source of truth for the
    # route table, which gate 16.13 checks, and no second copy to keep in sync by hand.
    include /etc/nginx/conf.d/*.conf;
}
